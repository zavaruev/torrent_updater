services:
  torrent-updater:
    build: .
    container_name: torrent-updater
    network_mode: host
    dns:
      # DNS-роутера задаётся в .env (HOME_DNS) — внутренние IP не хранятся в git.
      - ${HOME_DNS:?HOME_DNS is not set in .env}
    restart: always
    env_file:
      - .env
    environment:
      - CHECK_INTERVAL=1
      - CHECK_INTERVAL_UNIT=hours
      - RUN_ON_STARTUP=true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/data/cache:/opt/data/cache
      # Jellyfin data dir (ro): WAL mode needs db + -wal + -shm together.
      # jellyfin_sync.refresh_db_copy() snapshots it to /tmp/jellyfin.db each cycle.
      - /mnt/media/docker-compose/jellyfin/config/data:/jellyfin-data:ro
      - /mnt/media/movies:/mnt/media/movies
      - /mnt/media/series:/mnt/media/series
    shm_size: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
