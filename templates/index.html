<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Updater</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230066cc' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 2v6h-6'/><path d='M3 12a9 9 0 0 1 15-6.7L21 8'/><path d='M3 22v-6h6'/><path d='M21 12a9 9 0 0 1-15 6.7L3 16'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #0066cc;
            --accent-hover: #0055a8;
            --accent-focus: #0071e3;
            --ink: #1d1d1f;
            --muted: #6e6e73;
            --hairline: #e0e0e0;
            --divider: #f0f0f0;
            --canvas: #ffffff;
            --parchment: #f5f5f7;
            --success: #30d158;
            --success-bg: #e8f8ed;
            --error: #ff3b30;
            --error-bg: #fff0ef;
            --warning: #ff9f0a;
            --warning-bg: #fff6e5;
            --banner-bg: #f0f7ff;
            --scrollbar: #c7c7cc;
            --scrollbar-hover: #a8a8ad;
            --radius-card: 18px;
            --radius-pill: 9999px;
            --content-width: 840px;
            --log-warning: #b87800;
            --log-success: #248a3d;
        }

        [data-theme="dark"] {
            --accent: #2997ff;
            --accent-hover: #66b5ff;
            --accent-focus: #40a9ff;
            --ink: #f5f5f7;
            --muted: #98989d;
            --hairline: #424245;
            --divider: #38383a;
            --canvas: #2a2a2c;
            --parchment: #38383a;
            --success: #30d158;
            --success-bg: #1a3a22;
            --error: #ff453a;
            --error-bg: #3a1f1e;
            --warning: #ff9f0a;
            --warning-bg: #3a2e14;
            --banner-bg: #1a2a3a;
            --scrollbar: #545458;
            --scrollbar-hover: #636366;
            --log-warning: #ff9f0a;
            --log-success: #30d158;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--parchment);
            color: var(--ink);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 17px;
            line-height: 1.47;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
            padding: 48px 24px;
            min-height: 100vh;
            transition: background 0.25s, color 0.25s;
        }

        .container {
            max-width: var(--content-width);
            margin: 0 auto;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--ink);
        }

        /* ── Pill Button ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.29;
            letter-spacing: -0.014em;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn.checking { opacity: 0.6; }

        /* ── Theme Toggle ── */
        .theme-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--hairline);
            background: var(--canvas);
            color: var(--ink);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        .theme-btn:hover { background: var(--parchment); }
        .theme-btn:active { transform: scale(0.9); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinning { animation: spin 0.8s linear infinite; }

        /* ── Progress bar ── */
        .progress-bar-wrap {
            height: 2px;
            background: var(--divider);
            border-radius: var(--radius-pill);
            overflow: hidden;
            margin-bottom: 28px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--accent);
            border-radius: var(--radius-pill);
        }

        /* ── Stats row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

        .stat-card {
            background: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-card);
            padding: 16px 18px;
            transition: background 0.25s, border-color 0.25s;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: -0.008em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-value.accent { color: var(--accent); }
        .stat-value.success { color: var(--success); }

        /* ── Updates banner ── */
        .updates-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 400;
            color: var(--accent);
            background: var(--banner-bg);
            border-radius: var(--radius-card);
        }

        .updates-banner.visible { display: flex; }

        /* ── Section card ── */
        .section {
            background: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-card);
            overflow: hidden;
            margin-bottom: 16px;
            transition: background 0.25s, border-color 0.25s;
        }

        #logs-section { max-height: 450px; }
        #logs-list { max-height: 400px; overflow-y: auto; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--divider);
            transition: border-color 0.25s;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .section-meta {
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        /* ── Torrent list ── */
        .torrent-list { padding: 0; }

        .torrent-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--divider);
            transition: background 0.15s, border-color 0.25s;
        }

        .torrent-row:last-child { border-bottom: none; }
        .torrent-row:hover { background: var(--parchment); }

        .torrent-name {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: -0.014em;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        a.torrent-link {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        a.torrent-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .torrent-time {
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
            white-space: nowrap;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-ok {
            color: #248a3d;
            background: var(--success-bg);
        }

        .badge-updated {
            color: var(--accent);
            background: var(--banner-bg);
        }

        .badge-error {
            color: var(--error);
            background: var(--error-bg);
        }

        .badge-season-complete {
            color: #9a6700;
            background: #fef3c7;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            letter-spacing: -0.014em;
        }

        /* ── Log rows ── */
        .log-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 6px 20px;
            border-bottom: 1px solid var(--divider);
            font-size: 13px;
            letter-spacing: -0.012em;
            transition: background 0.15s, border-color 0.25s;
        }

        .log-row:last-child { border-bottom: none; }
        .log-row:hover { background: var(--parchment); }

        .log-time {
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }

        .log-message {
            flex: 1;
            line-height: 1.43;
            word-break: break-word;
        }

        .log-info { color: var(--ink); }
        .log-warning { color: var(--log-warning); }
        .log-error { color: var(--error); }
        .log-success { color: var(--log-success); }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar);
            border-radius: var(--radius-pill);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
        /* ── Search & recommendations (merged) ── */
        .form-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; padding: 16px 18px 12px; }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
        .form-grid input, .form-grid select {
            width: 100%; padding: 10px 14px; font: inherit; font-size: 14px;
            color: var(--ink); background: var(--parchment);
            border: 1px solid var(--hairline); border-radius: var(--radius-pill); outline: none;
        }
        .form-grid input:focus, .form-grid select:focus { border-color: var(--accent-focus); }
        .form-actions { display: flex; gap: 10px; align-items: center; padding: 0 18px 16px; }
        .form-status { font-size: 13px; color: var(--muted); }
        .form-result { padding: 0 18px 16px; font-size: 14px; }
        .form-result.success { color: var(--success); }
        .form-result.error { color: var(--error); }
    </style>
</head>
<body>
    <div class="container">

        <header>
            <h1>Torrent Updater</h1>
            <div style="display:flex;align-items:center;gap:10px">
                <button class="theme-btn" id="theme-btn" title="Toggle theme">
                    <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="btn" id="check-btn">
                    <svg id="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                    <span id="btn-text">Check</span>
                </button>
            </div>
        </header>

        <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Last check</div>
                <div class="stat-value" id="last-check">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Next check</div>
                <div class="stat-value" id="next-check">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total checks</div>
                <div class="stat-value accent" id="total-checks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Updated</div>
                <div class="stat-value success" id="total-updates">0</div>
            </div>
        </div>

        <div class="updates-banner" id="updates-banner">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            <span id="updates-banner-text">Updates found</span>
        </div>

        <!-- On-demand search & download -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Search & Download</span>
            </div>
            <form id="search-form" class="form-grid">
                <input type="text" id="sq" placeholder="Title, e.g. The Simpsons" required>
                <select id="st">
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                </select>
                <input type="text" id="si" placeholder="IMDb ID (optional, e.g. tt0096697)">
                <input type="number" id="ss" placeholder="Season (series only)" min="1">
            </form>
            <div class="form-actions">
                <button class="btn" id="search-btn" type="submit" form="search-form">Search & Download</button>
                <span class="form-status" id="search-status"></span>
            </div>
            <div class="form-result" id="search-result"></div>
        </div>

        <!-- Daily recommendations -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Recommendations</span>
                <span class="section-meta" id="rec-count"></span>
            </div>
            <div class="torrent-list" id="rec-list">
                <div class="empty-state">Loading…</div>
            </div>
        </div>

        <!-- Torrent list -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Torrents</span>
                <span class="section-meta" id="torrent-count"></span>
            </div>
            <div class="torrent-list" id="torrent-list">
                <div class="empty-state">No data — run check</div>
            </div>
        </div>

        <!-- Only errors (if any) -->
        <div class="section" id="errors-section" style="display:none">
            <div class="section-header">
                <span class="section-title">Errors</span>
                <span class="section-meta" id="errors-count"></span>
            </div>
            <div class="torrent-list" id="errors-list"></div>
        </div>

        <!-- Recent logs -->
        <div class="section" id="logs-section" style="display:none">
            <div class="section-header">
                <span class="section-title">Logs</span>
                <span class="section-meta" id="logs-count"></span>
            </div>
            <div class="torrent-list" id="logs-list"></div>
        </div>

    </div>

    <script>
        let prevStatus = null;
        let checkingProgress = 0;

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                // ── Check button state ──
                const isActive = data.status !== 'idle';
                const btnText = document.getElementById('btn-text');
                const btnIcon = document.getElementById('btn-icon');
                const labels = { idle: 'Check', checking: 'Checking…', updating: 'Updating…' };
                btnText.textContent = labels[data.status] || data.status;
                checkBtn.disabled = isActive;
                checkBtn.classList.toggle('checking', isActive);
                btnIcon.classList.toggle('spinning', isActive);

                // ── Progress bar while checking ──
                const wrap = document.getElementById('progress-wrap');
                const bar = document.getElementById('progress-bar');
                if (isActive) {
                    wrap.style.display = 'block';
                    checkingProgress = Math.min(checkingProgress + 2, 98);
                    bar.style.width = checkingProgress + '%';
                } else {
                    if (checkingProgress > 0) {
                        bar.style.width = '100%';
                        setTimeout(() => {
                            wrap.style.display = 'none';
                            checkingProgress = 0;
                        }, 600);
                    }
                }

                // ── Stats ──
                const fmt = s => s ? s.replace(/^\d{4}-\d{2}-\d{2} /, '') : '—';
                document.getElementById('last-check').textContent = fmt(data.last_check);
                document.getElementById('next-check').textContent = fmt(data.next_check);
                document.getElementById('total-checks').textContent = data.total_checks || 0;
                document.getElementById('total-updates').textContent = data.total_updates || 0;

                // ── Deduplicate history: keep only last record per torrent name ──
                const seen = new Map();
                if (data.history) {
                    for (const item of data.history) {
                        if (!seen.has(item.torrent)) {
                            seen.set(item.torrent, item);
                        }
                    }
                }

                const torrents = [...seen.values()];
                const errors = torrents.filter(t => t.state === 'error');
                const updated = torrents.filter(t => t.state === 'updated');

                // ── Updates banner ──
                const banner = document.getElementById('updates-banner');
                if (updated.length > 0) {
                    banner.classList.add('visible');
                    document.getElementById('updates-banner-text').textContent =
                        `Updated: ${updated.length === 1 ? updated[0].torrent : updated.length + ' torrents'}`;
                } else {
                    banner.classList.remove('visible');
                }

                // ── Torrent list ──
                const list = document.getElementById('torrent-list');
                document.getElementById('torrent-count').textContent =
                    torrents.length ? `${torrents.length} pcs.` : '';

                if (torrents.length === 0) {
                    list.innerHTML = '<div class="empty-state">No data — run check</div>';
                } else {
                    torrents.sort((a, b) => {
                        const order = { error: 0, updated: 1, ok: 2 };
                        return (order[a.state] ?? 3) - (order[b.state] ?? 3);
                    });
                    list.innerHTML = torrents.map(item => renderRow(item)).join('');
                }

                // ── Errors section ──
                const errSec = document.getElementById('errors-section');
                if (errors.length > 0) {
                    errSec.style.display = 'block';
                    document.getElementById('errors-count').textContent = `${errors.length} pcs.`;
                    document.getElementById('errors-list').innerHTML =
                        errors.map(item => renderErrorRow(item)).join('');
                } else {
                    errSec.style.display = 'none';
                }

                // ── Logs section ──
                const logsSec = document.getElementById('logs-section');
                const logs = data.logs || [];
                const logsList = document.getElementById('logs-list');
                const prevScrollTop = logsList.scrollTop;
                const prevScrollHeight = logsList.scrollHeight;
                const wasAtBottom = prevScrollTop + 10 >= prevScrollHeight - logsList.clientHeight;

                if (logs.length > 0) {
                    logsSec.style.display = 'block';
                    document.getElementById('logs-count').textContent = `${logs.length} pcs.`;
                    logsList.innerHTML = logs.map(item => renderLogRow(item)).join('');
                    if (wasAtBottom) {
                        logsList.scrollTop = logsList.scrollHeight;
                    }
                } else {
                    logsSec.style.display = 'none';
                }

            } catch (e) {
                console.error(e);
            }
        }

        function truncate(s, n) {
            return s.length > n ? s.slice(0, n) + '…' : s;
        }

        function renderRow(item) {
            const badges = {
                ok:               '<span class="badge badge-ok">Up to date</span>',
                updated:          '<span class="badge badge-updated">Updated</span>',
                error:            '<span class="badge badge-error">Error</span>',
                season_complete:  '<span class="badge badge-season-complete">Season complete</span>',
            };
            const badge = badges[item.state] || `<span class="badge">${item.state}</span>`;

            const dates = (item.local_date && item.tracker_date && item.local_date !== '?')
                ? `${item.local_date} → ${item.tracker_date}` : '';

            return `
                <div class="torrent-row" title="${escHtml(item.torrent)}${dates ? '\n' + dates : ''}">
                    <div class="torrent-name">${item.torrent_url ? `<a class="torrent-link" href="${escHtml(item.torrent_url)}" target="_blank" rel="noopener">${escHtml(truncate(item.torrent, 65))}</a>` : escHtml(truncate(item.torrent, 65))}</div>
                    <div class="torrent-time">${item.time || ''}</div>
                    ${badge}
                </div>`;
        }

        function renderErrorRow(item) {
            const msg = item.error_msg || 'No data';
            return `
                <div class="torrent-row" title="${escHtml(item.torrent)}\n${escHtml(msg)}">
                    <div class="torrent-name" style="color:var(--error)">${item.torrent_url ? `<a class="torrent-link" href="${escHtml(item.torrent_url)}" target="_blank" rel="noopener" style="color:var(--error)">${escHtml(truncate(item.torrent, 50))}</a>` : escHtml(truncate(item.torrent, 50))}</div>
                    <div class="torrent-time" style="color:var(--error)">${escHtml(truncate(msg, 35))}</div>
                    <span class="badge badge-error">Error</span>
                </div>`;
        }

        function renderLogRow(item) {
            const msg = String(item);
            const timeMatch = msg.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
            const time = timeMatch ? timeMatch[1].split(' ')[1] : '';
            const levelMatch = msg.match(/ - (INFO|WARNING|ERROR|SUCCESS) - /);
            const level = levelMatch ? levelMatch[1] : 'INFO';
            const message = levelMatch ? msg.split(levelMatch[0])[1] : msg;

            const colors = {
                'INFO': 'log-info',
                'WARNING': 'log-warning',
                'ERROR': 'log-error',
                'SUCCESS': 'log-success'
            };
            const colorClass = colors[level] || 'log-info';

            return `
                <div class="log-row">
                    <div class="log-time">${time}</div>
                    <div class="log-message ${colorClass}">${escHtml(message)}</div>
                </div>`;
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g,'&amp;')
                .replace(/</g,'&lt;')
                .replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;');
        }

        // ── Recommendations ──
        async function loadRecommendations() {
            const list = document.getElementById('rec-list');
            try {
                const res = await fetch('/api/recommendations');
                const data = await res.json();
                const items = [
                    ...(data.movies || []).map(m => ({ ...m, kind: 'Movie' })),
                    ...(data.series || []).map(s => ({ ...s, kind: 'S' + String(s.season || '').padStart(2, '0') })),
                ];
                document.getElementById('rec-count').textContent = items.length ? `${items.length} pcs.` : '';
                if (!items.length) {
                    list.innerHTML = '<div class="empty-state">No recommendations cached</div>';
                    return;
                }
                list.innerHTML = items.map(m => {
                    const title = `${m.title || '?'} (${m.year || 'N/A'})`;
                    const meta = [`IMDb ${m.imdb_rating ?? '?'}`, `${m.seeders ?? '?'} seeders`, `${m.size_gb ?? '?'} GB`, m.quality, m.dub_studio].filter(Boolean).join(' • ');
                    const name = m.rutracker_url
                        ? `<a class="torrent-link" href="${escHtml(m.rutracker_url)}" target="_blank" rel="noopener">${escHtml(title)}</a>`
                        : escHtml(title);
                    return `<div class="torrent-row" title="${escHtml(title)}\n${escHtml(meta)}"><div class="torrent-name">${name}</div><div class="torrent-time">${escHtml(m.kind || '')}</div><span class="badge badge-ok">${escHtml(meta.split(' • ')[0] || '')}</span></div>`;
                }).join('');
            } catch (e) {
                console.error(e);
                list.innerHTML = '<div class="empty-state">Failed to load recommendations</div>';
            }
        }

        // ── On-demand search ──
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('search-btn');
            const status = document.getElementById('search-status');
            const result = document.getElementById('search-result');
            btn.disabled = true;
            status.textContent = 'Searching Rutracker…';
            result.className = 'form-result';
            result.textContent = '';
            try {
                const seasonVal = document.getElementById('ss').value;
                const res = await fetch('/api/search-and-download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: document.getElementById('sq').value,
                        type: document.getElementById('st').value,
                        imdb_id: document.getElementById('si').value || null,
                        season: seasonVal ? parseInt(seasonVal) : null,
                    }),
                });
                const data = await res.json();
                if (data.success) {
                    result.className = 'form-result success';
                    const t = data.torrent || {};
                    result.textContent = `Added: ${t.title || data.message || 'OK'}` + (data.jellyfin_verified ? ' (Jellyfin verified)' : '');
                } else {
                    result.className = 'form-result error';
                    result.textContent = `Error: ${data.error || 'unknown'}`;
                }
            } catch (err) {
                result.className = 'form-result error';
                result.textContent = `Request failed: ${err.message}`;
            } finally {
                btn.disabled = false;
                status.textContent = '';
            }
        });

        // ── Check button ──
        const checkBtn = document.getElementById('check-btn');

        checkBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/check', { method: 'POST' });
                checkingProgress = 5;
            } catch(e) { console.error(e); }
        });

        updateStatus();
        loadRecommendations();
        setInterval(updateStatus, 5000);
        setInterval(loadRecommendations, 60000);

        // ── Theme toggle ──
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const stored = localStorage.getItem('theme');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const isDark = theme === 'dark';
            themeIcon.innerHTML = isDark
                ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
                : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
        }

        if (stored === 'dark') { setTheme('dark'); }
        else if (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) { setTheme('dark'); }

        themeBtn.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            setTheme(next);
        });
    </script>
</body>
</html>
